[project]
name = "research-os-tooling"
version = "2.0.0"
description = "Validation, installation, and release tooling for Research OS skills."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
