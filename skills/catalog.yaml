version: "2.0.0"
source_of_truth: true
defaults:
  lifecycle: "stable"
  distribution: "core"
  replaced_by: null
composition:
  research-help: [research-grilling]
  research-setup: [research-workspace-contract]
  research-2-brief: [research-workspace-contract, synthesize-research-brief]
  research-3-falsify: [falsification-first]
  research-5-run: [research-review]
  research-6-review: [research-review]
  research-auto: [design-research-three-ways, falsification-first, pilot-study, render-research-deliverable, research-domain-modeling, research-grilling, research-review, research-workspace-contract, synthesize-research-brief]
  research-save: [artifact-reconciliation]
  to-paper: [render-research-deliverable, research-2-brief, research-auto]
  to-plan: [render-research-deliverable, research-2-brief, research-auto]
  to-proposal: [render-research-deliverable, research-2-brief, research-auto, research-grilling]
  artifact-reconciliation: [citation-audit]
  citation-audit: [evidence-research]
  contribution-design: [identification-design]
  data-feasibility: [construct-design, evidence-research, pilot-study]
  design-research-three-ways: [identification-design]
  equation-builder: [identification-design, research-domain-modeling]
  ethics-reproducibility: [citation-audit, data-feasibility, research-diagnosis]
  evidence-research: [gap-audit]
  falsification-first: [data-feasibility, identification-design, pilot-study]
  gap-audit: [evidence-research, literature-landscape]
  identification-design: [construct-design, data-feasibility, falsification-first]
  journal-fit: [research-review, research-writing]
  literature-landscape: [gap-audit]
  methodology-designer: [construct-design, data-feasibility, equation-builder, falsification-first, identification-design]
  pilot-study: [data-feasibility, ethics-reproducibility, identification-design]
  render-research-deliverable: [citation-audit, research-review, research-writing, synthesize-research-brief]
  research-domain-modeling: [artifact-reconciliation, research-grilling]
  research-grilling: [artifact-reconciliation, research-setup]
  research-review: [citation-audit, data-feasibility, ethics-reproducibility, identification-design]
  research-writing: [citation-audit, journal-fit]
  synthesize-research-brief: [artifact-reconciliation, research-grilling, research-workspace-contract]
  theory-builder: [equation-builder, identification-design, research-domain-modeling]
skills:
  # ---- one-time setup ----

  - name: "research-setup"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "contract"
    display_name: "Research Setup"
    short_description: "Initialize a durable research workspace contract"
    default_prompt: "Use $research-setup to initialize this project as a Research OS workspace."
    description: "Initialize a project with the durable Research OS workspace contract."

  # ---- mainline, steps 1 to 6 ----

  - name: "research-1-grill"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "decision tree"
    display_name: "Step 1 - Grill the Idea"
    short_description: "Interrogate a research idea one decision at a time"
    default_prompt: "Use $research-1-grill to stress-test and sharpen my research idea."
    description: "Interrogate a research idea one decision at a time until it is researchable."

  - name: "research-2-brief"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "collapse"
    display_name: "Step 2 - Lock the Design"
    short_description: "Collapse a discussion into a research contract"
    default_prompt: "Use $research-2-brief to turn this discussion into a rigorous research brief."
    description: "Collapse the current discussion and evidence into a rigorous research brief."

  - name: "research-3-falsify"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "kill"
    display_name: "Step 3 - Try to Kill It"
    short_description: "Predeclare what evidence would kill the design"
    default_prompt: "Use $research-3-falsify to predeclare what evidence would kill this research design."
    description: "Predeclare what evidence would kill the current research design before any expensive work begins."

  - name: "research-4-tasks"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "tracer study"
    display_name: "Step 4 - Split into Tasks"
    short_description: "Split a research brief into tracer workpackages"
    default_prompt: "Use $research-4-tasks to split this research brief into dependency-aware tracer studies."
    description: "Split a research brief into dependency-aware tracer workpackages."

  - name: "research-5-run"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "claim"
    display_name: "Step 5 - Run a Task"
    short_description: "Claim and execute one verified research workpackage"
    default_prompt: "Use $research-5-run to claim and execute the next eligible research workpackage."
    description: "Claim and execute one eligible research workpackage with bounded authority, falsification gates, receipts, and readback."

  - name: "research-6-review"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "reject"
    display_name: "Step 6 - Review"
    short_description: "Attack the design as a skeptical journal panel"
    default_prompt: "Use $research-6-review to review this work as a skeptical journal panel."
    description: "Attack the current research design or draft as a skeptical journal panel and record every finding."

  # ---- check position at any time ----

  - name: "research-status"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "position"
    display_name: "Research Status"
    short_description: "Show position, artifacts, gaps, and next action"
    default_prompt: "Use $research-status to show where this project stands and what to do next."
    description: "Show where the project stands on the mainline, what exists so far, and what the next action is."

  # ---- deliverables ----

  - name: "to-plan"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "execution case"
    display_name: "To Research Plan"
    short_description: "Build an executable academic research plan"
    default_prompt: "Use $to-plan to turn this verified Research Brief into an executable academic research plan."
    description: "Convert a verified Research Brief into an executable academic research plan."

  - name: "to-proposal"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "fundability"
    display_name: "To Proposal"
    short_description: "Turn a research design into a credible proposal"
    default_prompt: "Use $to-proposal to turn this research design into a credible proposal."
    description: "Turn a research design into a grant, institutional, or project proposal."

  - name: "to-paper"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "argument"
    display_name: "To Paper"
    short_description: "Draft a paper from verified research artifacts"
    default_prompt: "Use $to-paper to draft an academic paper from the verified project artifacts."
    description: "Draft an academic paper from verified research artifacts."

  # ---- off-mainline entries ----

  - name: "research-auto"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "adaptive loop"
    display_name: "Research Auto"
    short_description: "Turn a topic into a verified research deliverable"
    default_prompt: "Use $research-auto to turn this topic into a verified Research Brief and the research deliverable I need."
    description: "Develop a topic, direction, problem, source, or partial idea through adaptive interviewing, evidence research, reviewer attack, and repair until it becomes a verified Research Brief and the requested research plan, proposal, project brief, paper blueprint, or manuscript draft."

  - name: "research-triage"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "verdict"
    display_name: "Idea Verdict"
    short_description: "Kill, repair, pilot, or advance research ideas"
    default_prompt: "Use $research-triage to decide whether this research idea should be killed, repaired, piloted, or advanced."
    description: "Classify research ideas as kill, repair, pilot, or advance."

  - name: "research-map"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "fog"
    display_name: "Map a Big Project"
    short_description: "Map multi-session research decisions through fog"
    default_prompt: "Use $research-map to map this large, uncertain research effort."
    description: "Map a multi-session research effort as decisions that progressively clear the fog."

  - name: "research-save"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "continuity"
    display_name: "Save Progress"
    short_description: "Create a verifiable cross-session research handoff"
    default_prompt: "Use $research-save to prepare a verifiable handoff for the next research session."
    description: "Create a verifiable handoff that preserves research continuity across sessions."

  - name: "research-help"
    bucket: "orchestrators"
    invocation: "user"
    leading_word: "route"
    display_name: "Research Help"
    short_description: "Route a research task to the right workflow"
    default_prompt: "Use $research-help to help me choose the right Research OS workflow."
    description: "Route a research task to the right Research OS workflow."

  - name: "writing-research-skills"
    bucket: "meta"
    invocation: "user"
    leading_word: "predictability"
    display_name: "Writing Research Skills"
    short_description: "Design and maintain predictable research skills"
    default_prompt: "Use $writing-research-skills to create or improve a Research OS skill."
    description: "Design, review, and maintain predictable Research OS skills."

  - name: "research-grilling"
    bucket: "primitives"
    invocation: "model"
    leading_word: "decision tree"
    display_name: "Research Grilling"
    short_description: "Resolve research decisions one branch at a time"
    default_prompt: "Use $research-grilling to resolve the key decisions in my research idea."
    description: "Resolve a research decision tree through one-question-at-a-time interviewing. Use when a research question, plan, construct, mechanism, scope, or trade-off is ambiguous; when the user asks to be grilled; or when another research workflow needs human decisions separated from discoverable facts."

  - name: "research-workspace-contract"
    bucket: "primitives"
    invocation: "model"
    leading_word: "contract"
    display_name: "Research Workspace Contract"
    short_description: "Establish canonical research state without overwrite"
    default_prompt: "Use $research-workspace-contract to establish and verify the canonical research workspace for this authorized workflow."
    description: "Establish, resolve, and verify the durable Research OS workspace contract without overwriting existing work. Use when an explicitly authorized research workflow needs canonical context, decisions, evidence, briefs, outputs, handoffs, templates, or adapter paths initialized or repaired."

  - name: "artifact-reconciliation"
    bucket: "primitives"
    invocation: "model"
    leading_word: "intent"
    display_name: "Artifact Reconciliation"
    short_description: "Resolve conflicts without losing provenance"
    default_prompt: "Use $artifact-reconciliation to resolve these conflicting research artifacts without losing provenance."
    description: "Resolve conflicting canonical research artifacts into one verified current state without erasing either intent or provenance. Use when briefs, decisions, claims, methods, datasets, protocols, handoffs, revisions, or schema versions disagree and a downstream workflow cannot safely choose between them."

  - name: "research-domain-modeling"
    bucket: "primitives"
    invocation: "model"
    leading_word: "construct"
    display_name: "Research Domain Modeling"
    short_description: "Sharpen constructs, terms, relations, and decisions"
    default_prompt: "Use $research-domain-modeling to sharpen the constructs and vocabulary in this project."
    description: "Build and sharpen a research domain model. Use when constructs, variables, mechanisms, units, estimands, or field-specific terms are ambiguous; when a decision should be recorded; or when another research workflow needs the project vocabulary and research context maintained."

  - name: "evidence-research"
    bucket: "primitives"
    invocation: "model"
    leading_word: "claim chain"
    display_name: "Evidence Research"
    short_description: "Trace research claims to high-trust primary sources"
    default_prompt: "Use $evidence-research to investigate this claim against primary sources."
    description: "Trace research claims to high-trust primary sources and record an auditable claim chain. Use when a literature fact, dataset property, method claim, novelty claim, citation, or external factual premise must be verified rather than recalled."

  - name: "literature-landscape"
    bucket: "primitives"
    invocation: "model"
    leading_word: "map"
    display_name: "Literature Landscape"
    short_description: "Map theories, methods, data, findings, and disputes"
    default_prompt: "Use $literature-landscape to map the literature around this research question."
    description: "Map a literature into theories, mechanisms, methods, data, findings, and disputes. Use when the user needs a literature landscape, research stream map, conceptual synthesis, boundary search, or an evidence-backed view of what a field already knows."

  - name: "gap-audit"
    bucket: "primitives"
    invocation: "model"
    leading_word: "difference"
    display_name: "Gap Audit"
    short_description: "Test whether a claimed research gap is real"
    default_prompt: "Use $gap-audit to test whether this claimed research gap survives the literature."
    description: "Audit whether a claimed research gap is real, material, and defensible. Use when a topic is said to be novel, underexplored, first, missing, or different; when a reviewer could dismiss the gap as relabeling; or before writing a contribution claim."

  - name: "contribution-design"
    bucket: "primitives"
    invocation: "model"
    leading_word: "delta"
    display_name: "Contribution Design"
    short_description: "Turn novelty into a defensible contribution delta"
    default_prompt: "Use $contribution-design to turn this idea into a defensible contribution."
    description: "Design a defensible contribution delta against the closest literature. Use when a research idea needs theoretical, empirical, measurement, identification, data, or predictive contribution claims; when novelty exists but significance is unclear; or when a reviewer asks what the paper changes."

  - name: "design-research-three-ways"
    bucket: "primitives"
    invocation: "model"
    leading_word: "contrast"
    display_name: "Design Research Three Ways"
    short_description: "Generate and compare three genuinely different designs"
    default_prompt: "Use $design-research-three-ways to develop three contrasting designs for this question."
    description: "Generate and compare three genuinely different research designs under shared constraints. Use when the first design may be anchoring the project, when theory-first, identification-first, and data-first alternatives should be contrasted, or when a design choice needs independent parallel exploration."

  - name: "theory-builder"
    bucket: "primitives"
    invocation: "model"
    leading_word: "mechanism"
    display_name: "Theory Builder"
    short_description: "Build mechanisms, boundary conditions, and predictions"
    default_prompt: "Use $theory-builder to derive a mechanism and testable predictions for this question."
    description: "Build a theory from mechanisms, actors, incentives, frictions, boundary conditions, and discriminating predictions. Use when a paper needs a conceptual framework, propositions, causal chain, competing mechanisms, or economic meaning before equations or methods are chosen."

  - name: "construct-design"
    bucket: "primitives"
    invocation: "model"
    leading_word: "measurement"
    display_name: "Construct Design"
    short_description: "Define constructs and defensible measurement models"
    default_prompt: "Use $construct-design to define and operationalize the constructs in this study."
    description: "Define constructs and defensible measurement models. Use when abstract concepts must become variables, proxies, scales, indices, labels, or latent measures; when construct validity is at risk; or when measurement choices could create the finding."

  - name: "equation-builder"
    bucket: "primitives"
    invocation: "model"
    leading_word: "semantics"
    display_name: "Equation Builder"
    short_description: "Derive equations with economic and dimensional meaning"
    default_prompt: "Use $equation-builder to derive the equations and audit every symbol's meaning."
    description: "Derive and audit research equations so every symbol, operator, unit, assumption, boundary condition, and limiting case has economic meaning. Use for mathematical models, PDEs, stochastic processes, optimization, estimators, or when a borrowed equation risks being only an analogy."

  - name: "identification-design"
    bucket: "primitives"
    invocation: "model"
    leading_word: "counterfactual"
    display_name: "Identification Design"
    short_description: "Define estimands, counterfactuals, and threats"
    default_prompt: "Use $identification-design to define the estimand, counterfactual, and identification strategy."
    description: "Design identification around an estimand and credible counterfactual. Use when a study makes causal, mechanism, transmission, treatment, policy, or structural claims; when endogeneity, selection, simultaneity, measurement error, or non-synchronous timing threatens inference; or when predictive evidence is being confused with causal evidence."

  - name: "data-feasibility"
    bucket: "primitives"
    invocation: "model"
    leading_word: "obtainability"
    display_name: "Data Feasibility"
    short_description: "Verify data access, timing, coverage, and fitness"
    default_prompt: "Use $data-feasibility to verify whether the required data can actually support this study."
    description: "Verify data obtainability, timing, coverage, licensing, alignment, missingness, and fitness for the estimand. Use when a research design depends on a dataset, API, archive, index, panel, event window, frequency, or merge whose real availability and semantics must be checked."

  - name: "methodology-designer"
    bucket: "primitives"
    invocation: "model"
    leading_word: "alignment"
    display_name: "Methodology Designer"
    short_description: "Align questions, estimands, data, models, and tests"
    default_prompt: "Use $methodology-designer to align the question, estimand, data, model, and evaluation."
    description: "Align research questions, estimands, constructs, data, models, assumptions, diagnostics, baselines, and evaluation. Use when designing an empirical or theoretical method, choosing among models, translating equations into estimable form, or checking that every hypothesis has an observable test."

  - name: "falsification-first"
    bucket: "primitives"
    invocation: "model"
    leading_word: "kill"
    display_name: "Falsification First"
    short_description: "Try to kill the paper before reviewers do"
    default_prompt: "Use $falsification-first to design tests that could kill this paper's central claim."
    description: "Try to kill a research claim before reviewers do. Use when a hypothesis, mechanism, novelty claim, empirical design, or model needs falsifiers, rival explanations, placebo tests, negative controls, failure thresholds, or a predeclared kill-repair-continue rule."

  - name: "pilot-study"
    bucket: "primitives"
    invocation: "model"
    leading_word: "tracer study"
    display_name: "Pilot Study"
    short_description: "Build the smallest empirical or interaction tracer"
    default_prompt: "Use $pilot-study to design the smallest end-to-end tracer study for this project."
    description: "Design the smallest end-to-end tracer study or interaction prototype that can expose feasibility, identification, representation, or usability failures. Use when a research idea needs a pilot, proof of concept, minimum viable dataset, preliminary estimation, questionnaire or coding-flow test, research-tool prototype, power reconnaissance, or go-no-go evidence before full execution."

  - name: "research-review"
    bucket: "primitives"
    invocation: "model"
    leading_word: "reject"
    display_name: "Research Review"
    short_description: "Run independent reviewer attacks across six axes"
    default_prompt: "Use $research-review to review this work as a skeptical journal panel."
    description: "Review research as a skeptical journal panel across contribution, theory, identification, measurement and data, evidence, and execution. Use when the user asks for peer review, referee comments, pre-submission audit, red-team review, major-revision risks, or an independent assessment of a paper, brief, model, or proposal."

  - name: "research-diagnosis"
    bucket: "primitives"
    invocation: "model"
    leading_word: "bottleneck"
    display_name: "Research Diagnosis"
    short_description: "Diagnose stalled research through a tight feedback loop"
    default_prompt: "Use $research-diagnosis to find the real bottleneck in this stalled project."
    description: "Diagnose a stalled, contradictory, or failing research project through a tight feedback loop. Use when results collapse, code and theory disagree, a reviewer attack cannot be repaired, a design keeps changing, a replication fails, or the team is doing more work without reducing uncertainty."

  - name: "citation-audit"
    bucket: "primitives"
    invocation: "model"
    leading_word: "entailment"
    display_name: "Citation Audit"
    short_description: "Verify that citations entail the claims they support"
    default_prompt: "Use $citation-audit to verify every material claim and citation in this draft."
    description: "Verify that citations exist, are primary where appropriate, and entail the claims they support. Use when auditing a manuscript, literature review, novelty claim, dataset statement, quotation, benchmark, reference list, or any draft where fabricated, stale, indirect, or overclaimed citations would be costly."

  - name: "journal-fit"
    bucket: "primitives"
    invocation: "model"
    leading_word: "audience"
    display_name: "Journal Fit"
    short_description: "Match contribution and evidence to a journal audience"
    default_prompt: "Use $journal-fit to assess the best journal audience and required changes."
    description: "Match a research contribution, evidence standard, method, and narrative to a journal audience. Use when selecting target journals, comparing outlet fit, reverse-designing a submission, diagnosing desk-reject risk, or deciding whether a project is finance, economics, management, methods, or interdisciplinary work."

  - name: "research-writing"
    bucket: "primitives"
    invocation: "model"
    leading_word: "argument"
    display_name: "Research Writing"
    short_description: "Write evidence-led academic prose as an argument"
    default_prompt: "Use $research-writing to turn these verified findings into academic prose."
    description: "Write and revise evidence-led academic prose as a cumulative argument. Use for introductions, literature reviews, theory sections, methods, results, discussions, abstracts, reviewer responses, or finance and economics prose that must synthesize rather than list sources."

  - name: "synthesize-research-brief"
    bucket: "primitives"
    invocation: "model"
    leading_word: "collapse"
    display_name: "Synthesize Research Brief"
    short_description: "Collapse verified research state into one contract"
    default_prompt: "Use $synthesize-research-brief to collapse this verified research state into the canonical Research Brief."
    description: "Synthesize verified research state into one canonical Research Brief. Use when an adaptive research conversation has resolved enough question, evidence, contribution, theory, measurement, identification, data, method, and falsification state for downstream planning, proposal, or paper work."

  - name: "render-research-deliverable"
    bucket: "primitives"
    invocation: "model"
    leading_word: "artifact contract"
    display_name: "Render Research Deliverable"
    short_description: "Render verified research into the requested artifact"
    default_prompt: "Use $render-research-deliverable to turn this verified Research Brief into the requested final artifact."
    description: "Render a verified Research Brief into a fit-for-purpose academic research plan, grant proposal, project proposal, paper blueprint, or manuscript draft. Use when the destination artifact is known and its claims, decisions, methods, and evidence must be assembled without inventing missing work."

  - name: "ethics-reproducibility"
    bucket: "primitives"
    invocation: "model"
    leading_word: "audit trail"
    display_name: "Ethics and Reproducibility"
    short_description: "Design ethical, reproducible, and auditable research"
    default_prompt: "Use $ethics-reproducibility to audit this design for ethics and reproducibility."
    description: "Design ethical, reproducible, and auditable research. Use when a study involves human participants, personal or licensed data, model-assisted analysis, preregistration, provenance, computational reproducibility, conflicts of interest, disclosure, consent, or a replication package."
