(()=>{const id="s02",d=23.066666666666666,scope=document.getElementById(id+'-stage');
const tl=gsap.timeline({paused:true});
// Adapted from the existing Claude Max collaboration in evidence/claude-code-followup.json.
// Review changes: preserve contrast, avoid borderWidth/layout animation, explicit return states.
const RO_AMBER = "#FFCE57";
const RO_MUTED = "#596479";

function evidenceFocus(tl, element, start, hold, scale, targetOffsetX, targetOffsetY) {
  const tx = -targetOffsetX * scale;
  const ty = -targetOffsetY * scale;
  tl.fromTo(element,
    {x: 0, y: 0, scale: 1, transformOrigin: "50% 50%"},
    {x: tx, y: ty, scale, duration: .9, ease: "power2.inOut", immediateRender: false}, start);
  tl.fromTo(element, {x: tx, y: ty, scale},
    {x: 0, y: 0, scale: 1, duration: .8, ease: "power2.inOut", immediateRender: false},
    start + .9 + hold);
  return tl;
}

function flowFrontier(tl, nodes, start, span) {
  const list = Array.from(nodes).slice(0, 6);
  const step = span / Math.max(list.length, 1);
  list.forEach((node, i) => {
    const rect = node.querySelector("rect");
    if (rect) tl.fromTo(rect, {stroke: RO_MUTED},
      {stroke: RO_AMBER, duration: Math.min(.5, step*.8), ease: "power1.out"}, start+i*step);
  });
  return tl;
}

function evidenceCompare(tl, beforeElement, afterElement, start, duration) {
  const d = Math.max(.4, duration);
  // .4 opacity in the raw proposal made the text too faint; retain .8 for readability.
  tl.fromTo(beforeElement, {opacity: 1},
    {opacity: .8, duration: d, ease: "power1.inOut", immediateRender: false}, start);
  tl.fromTo(afterElement, {opacity: .8},
    {opacity: 1, duration: d, ease: "power1.inOut", immediateRender: false}, start+d*.25);
  return tl;
}

const phases=scope.querySelectorAll('.phase');
phases.forEach(p=>{let a=Number(p.dataset.enter)*d,b=Number(p.dataset.leave)*d;
tl.fromTo(p,{opacity:0},{opacity:1,duration:.12,ease:'none'},a);
if(b<d)tl.fromTo(p,{opacity:1},{opacity:0,duration:.12,ease:'none',immediateRender:false},b-.12);
const lines=p.querySelectorAll('.terminal-line');lines.forEach((el,i)=>tl.fromTo(el,{opacity:0,y:12},{opacity:1,y:0,duration:.35,ease:'power2.out'},a+.25+i*Math.min(.8,(b-a-1)/Math.max(lines.length,1))));});
const pops=scope.querySelectorAll('[data-pop]');pops.forEach((el,i)=>tl.fromTo(el,{opacity:0,y:22},{opacity:1,y:0,duration:.5,ease:i%2?'power3.out':'power2.out'},.25+i*Math.min(.38,d*.65/Math.max(pops.length,1))));
scope.querySelectorAll('.trace').forEach((p,i)=>{let len=p.getTotalLength();p.style.strokeDasharray=String(len);tl.fromTo(p,{strokeDashoffset:len},{strokeDashoffset:0,duration:Math.min(1.3,d*.08),ease:'power2.out'},.5+i*Math.min(1.2,d*.45/Math.max(scope.querySelectorAll('.trace').length,1)));});
scope.querySelectorAll('.node-group').forEach((el,i)=>tl.fromTo(el,{opacity:0},{opacity:1,duration:.5,ease:'power1.out'},.3+i*Math.min(.65,d*.35/Math.max(scope.querySelectorAll('.node-group').length,1))));
scope.querySelectorAll('.discard').forEach((el,i)=>tl.fromTo(el,{opacity:1,x:0},{opacity:.24,x:-35,duration:1,ease:'power2.inOut',immediateRender:false},d*(.48+i*.13)));
tl.fromTo('#'+id+'-progress',{scaleX:0},{scaleX:1,duration:d,ease:'none'},0);
flowFrontier(tl,scope.querySelectorAll('.node-group'),d*.25,d*.55);
window.__timelines[id]=tl;})();
