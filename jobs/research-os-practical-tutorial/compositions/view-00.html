 | .research/config.yaml | complete | 2026-10-1\r\n7 | — |`\r\n- 「限制與排除」一節：寫入你這次給的工作邊界，包括不得虛構，以及目前還沒有研究資料、結果或文獻。\r\n- 其他研究欄位一律保留為 `Unresolved`。\r\n- 沒有建立決策紀錄，因為目前沒有任何選擇需要正式記錄。\r\n- `claims.yaml` 是空的，因為還沒有任何需要查證的主張。\r\n\r\n**還沒做的事**\r\n- `.research/` 還沒 commit。git 目前在 `demo` 分支，這個分支還沒有任何 commit。\r\n\r\n**下一個需要決定的研究問題**：研究問題本身還沒定，包括要研究什麼現象、分析單位和範圍。這部分交給主線第一\r\n步 `research-1-grill`。我按指示停在這裡，沒有往下進行。\r\n"], [37.375809, "o", "\r\nACTUAL FILE CHANGES / 真實檔案變動\r\n{\r\n  \"created\": [\r\n    \".research/CONTEXT.md\",\r\n    \".research/config.yaml\",\r\n    \".research/evidence/claims.yaml\",\r\n    \".research/templates/decision-record.md\",\r\n    \".research/templates/handoff.md\",\r\n    \".research/templates/map.md\",\r\n    \".research/templates/proposal.md\",\r\n    \".research/templates/research-brief.md\",\r\n    \".research/templates/research-plan.md\",\r\n    \".research/templates/review.md\",\r\n    \".research/templates/workpackage.md\"\r\n  ],\r\n  \"changed\": [],\r\n  \"removed\": []\r\n}\r\n"]]},document.getElementById('view-00-terminal'),{cols:120,rows:25,controls:false,fit:false,terminalFontSize:'24px',terminalLineHeight:1.2,terminalFontFamily:'ResearchMono,ResearchSans,monospace',cursorMode:'hidden',preload:true});players.push(p0);await p0.seek(0);drivers.push({start:0,end:12,a:0.3,b:4.5,player:p0,node:document.getElementById('view-00-terminal'),focus:false});
